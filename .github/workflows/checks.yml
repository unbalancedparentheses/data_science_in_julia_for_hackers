name: Book regression checks

on:
  push:
  pull_request:

concurrency:
  group: book-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep a parent for a newly created branch's first push.
          fetch-depth: 2
          # These checks use synthetic data; avoid fetching the image corpus.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/10_bees_vs_wasps/data/
            !/docs/data_science_in_julia_for_hackers_files/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.19'
      - name: Install test dependencies
        run: julia --project=tests -e 'using Pkg; Pkg.instantiate()'
      - name: Julia regression tests
        run: julia --project=tests tests/runtests.jl
      - name: Mars mission regression tests
        run: julia --startup-file=no 06_gravity/mission/runtests.jl
      - name: Site regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Teaching excerpts match executable source
        run: python3 teaching/check_source_excerpts.py
      - name: New chapter HTML is current
        run: python3 scripts/render_new_chapters.py --check
      - name: Mars teaching HTML preserves historical outputs
        run: python3 scripts/render_mars_teaching.py --check
      - name: Challenge companion HTML is current
        run: python3 scripts/render_challenges.py --check
      - name: Generated navigation and search are current
        run: |
          python3 scripts/update_navigation.py
          python3 scripts/update_search.py
          git diff --exit-code -- docs
      - name: Whitespace checks
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          # Inspect committed changes; a clean checkout has no working-tree diff.
          if [[ -z "$DIFF_BASE" || "$DIFF_BASE" =~ ^0+$ ]]; then
            DIFF_BASE="$(git rev-parse HEAD^)"
          fi
          if ! git cat-file -e "$DIFF_BASE^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$DIFF_BASE"
          fi
          git diff --check "$DIFF_BASE" HEAD

  new-chapters:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - chapter: 03_probability_intro
            test: smoke_test.jl
          - chapter: 14_model_evaluation
            test: runtests.jl
          - chapter: 15_tabular_learning
            test: runtests.jl
          - chapter: 16_causal_inference
            test: test.jl
          - chapter: 17_bayesian_workflow
            test: test.jl
    steps:
      - uses: actions/checkout@v4
        with:
          # These checks use synthetic data; avoid fetching the image corpus.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/10_bees_vs_wasps/data/
            !/docs/data_science_in_julia_for_hackers_files/
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Instantiate chapter environment
        shell: bash
        run: |
          if [ -f '${{ matrix.chapter }}/Project.toml' ]; then
            julia --project='${{ matrix.chapter }}' -e 'using Pkg; Pkg.instantiate()'
          fi
      - name: Run chapter regression tests
        run: julia --startup-file=no --project='${{ matrix.chapter }}' '${{ matrix.chapter }}/${{ matrix.test }}'
      - name: Check printed exercise solutions
        if: matrix.chapter == '17_bayesian_workflow'
        run: julia --startup-file=no --project=17_bayesian_workflow teaching/check_exercises.jl
      - name: Run MLJ integration tests
        if: matrix.chapter == '15_tabular_learning'
        run: julia --startup-file=no --project=15_tabular_learning 15_tabular_learning/integration_tests.jl

  quarto-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # These checks use synthetic data; avoid fetching the image corpus.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/10_bees_vs_wasps/data/
            !/docs/data_science_in_julia_for_hackers_files/
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.19'
      - name: Render native Julia pilot
        run: quarto render publishing/quarto
      - uses: actions/upload-artifact@v4
        with:
          name: quarto-julia-pilot
          path: publishing/quarto/_site/decision-costs.html
          if-no-files-found: error

  pluto-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/10_bees_vs_wasps/data/
            !/docs/data_science_in_julia_for_hackers_files/
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Instantiate notebook environments
        shell: bash
        run: |
          for project in tests/pluto 14_model_evaluation 15_tabular_learning 16_causal_inference 17_bayesian_workflow; do
            julia --project="$project" -e 'using Pkg; Pkg.instantiate()'
          done
      - name: Check native Pluto slider reactivity
        run: julia --startup-file=no --project=tests/pluto tests/pluto/runtests.jl
